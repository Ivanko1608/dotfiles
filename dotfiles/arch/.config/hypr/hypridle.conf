# Mirrors quattro's (omarchy/) hypridle.conf, minus Omarchy's screensaver.

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                                 # lock before suspend
    after_sleep_cmd = sleep 1 && wlopm --on '*'  # delay for PAM readiness, then turn on display
    inhibit_sleep = 3                                                        # wait until screen is locked
}

listener {
    timeout = 150                      # 2.5min
    on-timeout = loginctl lock-session # lock screen
}

listener {
    timeout = 330                                            # 5.5min
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0  # save state and turn off keyboard backlight
    on-resume = brightnessctl -rd '*::kbd_backlight'         # restore keyboard backlight
}

listener {
    timeout = 330                                                                    # 5.5min
    on-timeout = brightnessctl -s && wlopm --off '*'  # save brightness, screen off
    on-resume = wlopm --on '*' && brightnessctl -r     # screen on, restore brightness
}
