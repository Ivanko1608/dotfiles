# Prompt layout from Omarchy's config/starship.toml (see LICENSE-omarchy).
# theme-set keeps everything above the palette marker and appends the
# current theme's palette; ANSI names (cyan, ...) follow Ghostty's palette.
palette = "omarchy"
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold accent)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold accent"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# --- palette (replaced by theme-set) ---
[palettes.omarchy]
accent = "#7aa2f7"
