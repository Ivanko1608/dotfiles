general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(1a1b26)
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(1a1b26ee)
    outer_color = rgba(33ccffee)
    outline_thickness = 4

    font_family = JetBrainsMonoNL Nerd Font
    font_color = rgb(a9b1d6)

    placeholder_text = Enter Password
    check_color = rgba(00ff99ee)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
